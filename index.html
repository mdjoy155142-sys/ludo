<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লুডু কিং - টেলিগ্রাম মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b192c;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 5px;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: #1e3e62;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .balance-card {
            background: #000;
            color: #f39c12;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #f39c12;
        }
        /* লুডু বোর্ড ডিজাইন */
        .ludo-board {
            width: 320px;
            height: 320px;
            margin: 15px auto;
            background: #fff;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            border: 4px solid #000;
            border-radius: 8px;
        }
        .base {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 10px;
            gap: 8px;
        }
        .red-base { background: #e74c3c; }
        .green-base { background: #2ecc71; }
        .yellow-base { background: #f1c40f; }
        .blue-base { background: #3498db; }

        .token-circle {
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .center-home {
            background: #fdfefe;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .dice-section {
            background: #162032;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #4a6fa5;
        }
        .dice-display {
            font-size: 35px;
            margin: 5px 0;
        }
        .btn-roll {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-roll:active { transform: scale(0.98); }

        .box {
            background: #162032;
            border: 1px solid #4a6fa5;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }
        input, select {
            padding: 8px;
            width: 85%;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 14px;
            margin-bottom: 8px;
            background: #fff;
            color: #000;
        }
        .btn-action {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            width: 90%;
            font-weight: bold;
        }
        .refer-box { background: #2c3e50; border-color: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="welcomeText" style="margin: 5px 0 10px 0; color: #f39c12;">👑 লুডু কিং মিনি অ্যাপ</h2>

    <!-- ব্যালেন্স কার্ড -->
    <div class="balance-card">
        🪙 ব্যালেন্স: <span id="userBalance">1000</span> টাকা
    </div>

    <!-- ক্লাসিক লুডু বোর্ড -->
    <div class="ludo-board">
        <!-- লাল বেস (Player 2) -->
        <div class="base red-base">
            <div class="token-circle">🔴</div>
            <div class="token-circle">🔴</div>
            <div class="token-circle">🔴</div>
            <div class="token-circle">🔴</div>
        </div>
        
        <!-- সবুজ বেস (Player 3) -->
        <div class="base green-base">
            <div class="token-circle">🟢</div>
            <div class="token-circle">🟢</div>
            <div class="token-circle">🟢</div>
            <div class="token-circle">🟢</div>
        </div>

        <!-- মাঝের হোম -->
        <div class="center-home">
            <span>🏆 LUDO</span>
            <span id="turnIndicator" style="font-size: 11px; color: #e74c3c;">আপনার পালা</span>
        </div>

        <!-- নীল বেস (Player 1) -->
        <div class="base blue-base">
            <div class="token-circle">🔵</div>
            <div class="token-circle">🔵</div>
            <div class="token-circle">🔵</div>
            <div class="token-circle">🔵</div>
        </div>

        <!-- হলুদ বেস (Player 4) -->
        <div class="base yellow-base">
            <div class="token-circle">🟡</div>
            <div class="token-circle">🟡</div>
            <div class="token-circle">🟡</div>
            <div class="token-circle">🟡</div>
        </div>
    </div>

    <!-- ছক্কা ও গেম কন্ট্রোল -->
    <div class="dice-section">
        <div class="dice-display" id="diceVal">🎲 ⚀</div>
        <button class="btn-roll" onclick="rollDice()">ছক্কা ফেলুন (Roll Dice)</button>
        <p id="gameStatus" style="margin: 8px 0 0 0; font-size: 13px; font-weight: bold; color: #f1c40f;"></p>
    </div>

    <!-- ডিপোজিট সেকশন -->
    <div class="box">
        <p style="margin: 0 0 5px 0; font-weight: bold; color: #e2136e;">বিকাশ ডিপোজিট</p>
        <p style="font-size: 12px; margin: 0; color: #ccc;">মার্চেন্ট নম্বর: <b style="color: #fff;">01919130118</b></p>
        <input type="text" id="trxIdInput" placeholder="বিকাশ TrxID দিন" style="margin-top: 5px;">
        <br>
        <button class="btn-action" style="background-color: #e2136e;" onclick="submitDeposit()">ডিপোজিট রিকোয়েস্ট পাঠান</button>
        <p id="depositMsg" style="font-size: 11px; margin: 3px 0 0 0; font-weight: bold;"></p>
    </div>

    <!-- রেফার সেকশন -->
    <div class="box refer-box">
        <p style="margin: 0 0 3px 0; font-weight: bold; color: #f39c12;">বন্ধুদের রেফার করুন</p>
        <input type="text" id="referLinkInput" readonly style="font-size: 11px; background: #fff;">
        <br>
        <button class="btn-action" style="background-color: #d35400; padding: 6px;" onclick="shareReferralLink()">শেয়ার লিংক</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let user = tg.initDataUnsafe?.user;
    let userName = user ? (user.first_name + (user.last_name ? " " + user.last_name : "")) : "প্লেয়ার";
    let userId = user ? user.id : "12345";

    if (user && user.first_name) {
        document.getElementById('welcomeText').innerText = `👑 ${user.first_name}-এর লুডু কিং`;
    }

    const botToken = "8943237412:AAHrUDQbEF9kTWHwi0qJh7S2-axll0UIfcY"; 
    const adminChatId = "7100342395"; 
    const botUsername = "Ludo88_Bot"; 

    let userBalance = 1000;
    document.getElementById('userBalance').innerText = userBalance;

    let userReferLink = `https://t.me/${botUsername}?start=ref_${userId}`;
    document.getElementById('referLinkInput').value = userReferLink;

    let startParam = tg.initDataUnsafe?.start_param;
    if (startParam && startParam.startsWith("ref_")) {
        userBalance += 10;
        document.getElementById('userBalance').innerText = userBalance;
        alert("🎉 অভিনন্দন! রেফার লিংকে জয়েন করার জন্য ১০ টাকা বোনাস পেয়েছেন।");
    }

    function shareReferralLink() {
        let telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(userReferLink)}&text=${encodeURIComponent("লুডু কিং খেলে টাকা আয় করুন! ১০ টাকা ফ্রি বোনাস পান:")}`;
        window.open(telegramShareUrl, '_blank');
    }

    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
        let diceIdx = Math.floor(Math.random() * 6);
        let diceNum = diceIdx + 1;
        document.getElementById('diceVal').innerText = `🎲 ${diceFaces[diceIdx]}`;

        if (diceNum === 6) {
            document.getElementById('gameStatus.innerText') = "🔥 দারুণ! ছক্কা উঠেছে, টোকেন ওপেন করুন!";
            document.getElementById('gameStatus').style.color = "#2ecc71";
            userBalance += 5; // বোনাস পয়েন্ট
            document.getElementById('userBalance').innerText = userBalance;
        } else {
            document.getElementById('gameStatus').innerText = `আপনি ${diceNum} পেয়েছেন।`;
            document.getElementById('gameStatus').style.color = "#f1c40f";
        }
        tg.HapticFeedback.impactOccurred('medium');
    }

    function submitDeposit() {
        let trxId = document.getElementById('trxIdInput').value.trim();
        if (trxId === "") {
            alert("সঠিক TrxID লিখুন!");
            return;
        }

        document.getElementById('depositMsg').innerText = "পাঠানো হচ্ছে...";
        let message = `📥 নতুন লুডু ডিপোজিট রিকোয়েস্ট!\n\n👤 নাম: ${userName}\n🆔 আইডি: ${userId}\n💳 TrxID: ${trxId}`;
        let url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${adminChatId}&text=` + encodeURIComponent(message);

        fetch(url).then(res => res.json()).then(data => {
            if (data.ok) {
                document.getElementById('depositMsg').innerText = "✅ রিকোয়েস্ট সফলভাবে জমা হয়েছে!";
                document.getElementById('depositMsg').style.color = "#2ecc71";
            }
        });
    }
</script>

</body>
</html>
